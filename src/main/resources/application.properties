# Safe local default so the application can start without a separately installed database.
# This in-memory database is reset when the process stops; it is NOT production storage.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:dpservicecentercrm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
